name: CodeDNA Validation CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-sbom:
    name: Test and SBOM - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-api
          - inventory-api

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate application import
        run: |
          python - <<'PY'
          from app import app

          assert app is not None
          print("Application import validation passed")
          PY

      - name: Install CycloneDX SBOM generator
        run: |
          pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements \
            requirements.txt \
            --output-format JSON \
            --output-file sbom.json

          test -s sbom.json

      - name: Upload service SBOM
        uses: actions/upload-artifact@v4
        with:
          name: codedna-sbom-${{ matrix.service }}
          path: services/${{ matrix.service }}/sbom.json
          if-no-files-found: error
          retention-days: 7
