name: CodeDNA Validation Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deployment-evidence:
    name: Deploy Evidence - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-api
          - inventory-api

    steps:
      - name: Create GitHub deployment
        id: deployment
        uses: actions/github-script@v7
        env:
          SERVICE: ${{ matrix.service }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: `${process.env.SERVICE}:validation`,
              description: `CodeDNA validation deployment for ${process.env.SERVICE}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false
            });

            core.setOutput("deployment_id", response.data.id);

      - name: Mark deployment successful
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "success",
              description: "CodeDNA validation deployment evidence"
            });
